name: Kripto Sinyal Botu

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Sadece test maili gonder (gercek tarama yapma)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Botu calistir
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: python bybit_signal_bot.py

      - name: Durumu (state.json) geri kaydet
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "state guncellendi [skip ci]"
          git push
